<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProbeStack — Eirik Hoem</title>
<meta name="description" content="ProbeStack — connect Traeger and Meater probes and view all your temperatures in one dashboard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      var dark = saved ? saved === 'dark'
                       : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --paper:        #f3efe6;
    --paper-deep:   #ebe5d6;
    --ink:          #1d211b;
    --ink-soft:     #4a5147;
    --ink-mute:     #8a8d83;
    --rule:         #d6cfbe;
    --rule-soft:    #e3ddcc;
    --moss:         #3a5535;
    --moss-deep:    #28391f;
    --copper:       #a35a2c;
    --glow-moss:    rgba(58, 85, 53, 0.04);
    --glow-copper:  rgba(163, 90, 44, 0.05);
    --card-bg:      rgba(58, 85, 53, 0.05);
    --serif:        "Fraunces", "Iowan Old Style", Georgia, serif;
    --sans:         "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  :root[data-theme="dark"] {
    --paper:        #14160f;
    --paper-deep:   #1b1e15;
    --ink:          #ece7d8;
    --ink-soft:     #b9b6a6;
    --ink-mute:     #7e8175;
    --rule:         #353a2c;
    --rule-soft:    #2a2e22;
    --moss:         #7fa173;
    --moss-deep:    #a7c79a;
    --copper:       #d08a52;
    --glow-moss:    rgba(127, 161, 115, 0.06);
    --glow-copper:  rgba(208, 138, 82, 0.06);
    --card-bg:      rgba(127, 161, 115, 0.08);
  }

  html { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

  body {
    margin: 0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 15% 10%, var(--glow-moss), transparent 45%),
      radial-gradient(circle at 90% 80%, var(--glow-copper), transparent 50%);
    color: var(--ink);
    transition: background-color 0.3s ease, color 0.3s ease;
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    min-height: 100vh;
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 28px 96px;
  }

  /* ── Masthead ─────────────────────────────────────────── */
  .masthead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 56px;
    gap: 16px;
  }
  .masthead .mark {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 1.05rem;
    font-style: italic;
    letter-spacing: -0.01em;
    color: var(--moss-deep);
    text-decoration: none;
  }
  .masthead .mark::before {
    content: "❦";
    margin-right: 8px;
    color: var(--copper);
    font-style: normal;
  }
  .masthead .kicker {
    font-family: var(--sans);
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-mute);
    font-weight: 500;
  }

  /* ── Theme toggle ─────────────────────────────────────── */
  .theme-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    padding: 0;
    border: 1px solid var(--rule);
    border-radius: 50%;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease;
  }
  .theme-toggle:hover {
    border-color: var(--moss);
    color: var(--moss-deep);
    background: var(--card-bg);
  }
  .theme-toggle svg { width: 18px; height: 18px; }
  .theme-toggle .icon-sun { display: none; }
  html[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  html[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

  /* ── Title block ──────────────────────────────────────── */
  .title-block { margin-bottom: 52px; }
  .eyebrow {
    font-family: var(--sans);
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--copper);
    font-weight: 600;
    margin-bottom: 14px;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(2.4rem, 6vw, 3.6rem);
    line-height: 1.02;
    letter-spacing: -0.025em;
    margin: 0 0 18px;
    color: var(--ink);
  }
  h1 em { font-style: italic; font-weight: 400; color: var(--moss); }
  .lede {
    font-family: var(--serif);
    font-size: 1.12rem;
    line-height: 1.5;
    color: var(--ink-soft);
    max-width: 56ch;
    margin: 0;
  }

  /* ── Coming soon badge ────────────────────────────────── */
  .badge {
    display: inline-block;
    margin-top: 32px;
    font-family: var(--sans);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--copper);
    border: 1px solid var(--copper);
    border-radius: 2px;
    padding: 6px 14px;
  }

  /* ── Colophon ─────────────────────────────────────────── */
  .colophon {
    margin-top: 80px;
    padding-top: 22px;
    border-top: 1px solid var(--rule);
    font-family: var(--sans);
    font-size: 0.82rem;
    color: var(--ink-mute);
    line-height: 1.6;
  }
  .colophon a {
    color: var(--moss-deep);
    text-decoration: underline;
    text-decoration-color: var(--rule);
    text-underline-offset: 3px;
    transition: text-decoration-color 0.18s ease;
  }
  .colophon a:hover { text-decoration-color: var(--moss); }
  .colophon p { margin: 0.4em 0; }
</style>
</head>
<body>
  <main class="page">

    <header class="masthead">
      <a class="mark" href="/">← Eirik Hoem</a>
      <span class="kicker">Project</span>
      <span style="flex:1"></span>
      <button type="button" class="theme-toggle" id="theme-toggle"
              aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
      </button>
    </header>

    <section class="title-block">
      <div class="eyebrow">Project</div>
      <h1>ProbeStack<em>.</em></h1>
      <p class="lede">
        Connect your Traeger and Meater probes in one place and keep an eye on every
        temperature from a single, at-a-glance dashboard — no more switching between
        apps mid-cook.
      </p>
      <span class="badge">Coming soon</span>
    </section>

    <footer class="colophon">
      <p>© <span id="year"></span> Eirik Hoem · Ørsta / Oslo, Norway</p>
    </footer>

  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    (function () {
      var root = document.documentElement;
      var storageKey = 'theme';
      var media = window.matchMedia('(prefers-color-scheme: dark)');

      function apply(theme) {
        root.setAttribute('data-theme', theme);
      }

      var stored = null;
      try { stored = localStorage.getItem(storageKey); } catch (e) {}
      apply(stored || (media.matches ? 'dark' : 'light'));

      media.addEventListener('change', function (e) {
        var saved = null;
        try { saved = localStorage.getItem(storageKey); } catch (err) {}
        if (!saved) apply(e.matches ? 'dark' : 'light');
      });

      document.getElementById('theme-toggle').addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        apply(next);
        try { localStorage.setItem(storageKey, next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
